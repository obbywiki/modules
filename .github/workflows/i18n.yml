name: i18n
on:
  push:
    paths:
      - '**/i18n/**/*.json'
      - 'scripts/check-i18n-keys.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/i18n.yml'
  pull_request:
    paths:
      - '**/i18n/**/*.json'
      - 'scripts/check-i18n-keys.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/i18n.yml'

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check i18n key parity
        run: pnpm lint:i18n
