name: Luacheck
on:
  push:
    paths:
      - 'modules/**'
      - '.luacheckrc'
      - '.github/workflows/luacheck.yml'
  pull_request:
    paths:
      - 'modules/**'
      - '.luacheckrc'
      - '.github/workflows/luacheck.yml'

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve files to check
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"

            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi

          config_changed=false
          if [ -n "${base:-}" ]; then
            if git diff --name-only "$base" "${{ github.sha }}" -- .luacheckrc .github/workflows/luacheck.yml | grep -q .; then
              config_changed=true
            fi
          else
            config_changed=true
          fi

          if [ "$config_changed" = true ]; then
            echo "args=." >> "$GITHUB_OUTPUT"
            echo "Running luacheck on all files (config changed)"
            
            exit 0
          fi

          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- 'modules/**/*.lua' \
              | grep -vE '^modules/_legacy/|^modules/shared/_imported/' || true
          )

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "No Lua files to check"
            
            exit 0
          fi

          echo "args=${changed[*]}" >> "$GITHUB_OUTPUT"

          echo "Checking ${#changed[@]} file(s):"
          printf '  %s\n' "${changed[@]}"

      - name: Luacheck linter
        if: steps.files.outputs.args != ''
        uses: lunarmodules/luacheck@v1
        with:
          args: ${{ steps.files.outputs.args }}
