name: Luacheck
on:
  push:
    paths:
      - 'modules/**'
      - '.luacheckrc'
      - '.github/workflows/luacheck.yml'
  pull_request:
    paths:
      - 'modules/**'
      - '.luacheckrc'
      - '.github/workflows/luacheck.yml'

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed Lua files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            tip="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            tip="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse "${tip}^" 2>/dev/null || true)"
            fi
          fi

          if [ -z "${base:-}" ]; then
            echo "No base commit to diff against; skipping"
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "$base" "$tip" -- modules \
              | grep -E '\.lua$' \
              | grep -vE '^modules/_legacy/|^modules/shared/_imported/' || true
          )

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed Lua files"
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "args=${changed[*]}" >> "$GITHUB_OUTPUT"
          echo "Checking ${#changed[@]} file(s):"
          printf '  %s\n' "${changed[@]}"

      - name: Luacheck linter
        if: steps.files.outputs.args != ''
        uses: lunarmodules/luacheck@v1
        with:
          args: ${{ steps.files.outputs.args }}
