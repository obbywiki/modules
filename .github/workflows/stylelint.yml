name: Stylelint
on:
  push:
    paths:
      - '**/*.css'
      - '.stylelintrc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/stylelint.yml'
  pull_request:
    paths:
      - '**/*.css'
      - '.stylelintrc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/stylelint.yml'

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint CSS
        run: pnpm lint:css
