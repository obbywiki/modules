name: ESLint
on:
  push:
    paths:
      - 'mediawiki/**/*.js'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eslint.yml'
  pull_request:
    paths:
      - 'mediawiki/**/*.js'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eslint.yml'

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint JavaScript
        run: pnpm lint:js
