std = "luau+mw"
exclude = [
  "src/modules/_legacy/**",
  "src/modules/shared/_imported/**",
  "*.d.lua",
  "*.d.luau",
  "src/modules/**/scw:*",
  "src/modules/**/w:*",
  "src/modules/**/runescape:*",
  "src/modules/**/utgw:*",
  "src/modules/**/i:*",
]

[lints]
multiple_statements = "allow"
empty_if = "allow"
unused_variable = "allow"
mixed_table = "allow"